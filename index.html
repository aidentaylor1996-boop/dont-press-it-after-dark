const POWERS=["Shield","Steal","Swap","Double","Block","Peek","Lock","Risk","Challenge"];
const KEY="dpi_after_dark_complete_v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const clone=x=>JSON.parse(JSON.stringify(x));
let state=load(),audioCtx=null,timerHandle=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))||defaultState()}catch{return defaultState()}}
function defaultState(){return {screen:"home",settings:{sound:true,help:true,timer:30,reduced:false},memory:[],history:[],game:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast("Local saving is unavailable on this device.")}}
function active(){return (state.game?.players||[]).filter(p=>p.alive)}
function player(id){return (state.game?.players||[]).find(p=>p.id===id)}
function ranked(){return [...(state.game?.players||[])].sort((a,b)=>b.score-a.score)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function sound(type){if(!state.settings.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==="bad"?"sawtooth":"sine";o.frequency.value={click:260,reveal:430,good:700,bad:120,chaos:180,win:880}[type]||300;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.2)}catch{}}
function fx(type){if(state.settings.reduced)return;const el=document.querySelector(".reveal,.big,.title");if(el){el.classList.remove("pulse","shake");void el.offsetWidth;el.classList.add(type==="bad"?"shake":"pulse")}}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null}
function header(){return `<header class="top"><div class="brand">DON'T PRESS IT <span>AFTER DARK</span></div>${state.game?`<div class="row"><button class="btn" data-a="live">LIVE DISPLAY</button><button class="btn" data-a="home">HOME</button></div>`:""}</header>`}
function home(){stopTimer();state.screen="home";state.game=null;save();$("#app").innerHTML=header()+`<main class="screen"><section class="hero"><div class="eyebrow">LIVE INTERACTIVE GAME SHOW</div><h1 class="title">DON'T PRESS IT<small>AFTER DARK</small></h1><p class="muted">Eight players. Mystery boxes. Secret missions. Danger. Chaos. Every decision changes the game.</p></section><section class="grid menu"><button class="btn primary" data-a="new">START NEW GAME</button><button class="btn gold" data-a="replay">PLAY AGAIN — SAME PLAYERS</button><button class="btn" data-a="how">HOW TO PLAY</button><button class="btn" data-a="memory">PLAYER MEMORY</button><button class="btn" data-a="history">GAME HISTORY</button><button class="btn" data-a="settings">SETTINGS</button><button class="btn" data-a="planning">PRIZE / ENTRY PLANNING</button></section></main>`}
function setup(){state.screen="setup";save();const n=(state.memory||[]).slice(0,8);$("#app").innerHTML=header()+`<main class="screen"><div class="space"><div><span class="stage">PLAYER SETUP</span><h1>Choose your eight players</h1><p class="muted">All eight players are required.</p></div></div><div class="panel"><div class="fields">${Array.from({length:8},(_,i)=>`<div class="field"><label>PLAYER ${i+1}</label><input id="n${i}" value="${esc(n[i]||"")}" placeholder="Player ${i+1}"></div>`).join("")}</div><div class="row" style="margin-top:15px"><button class="btn primary" data-a="start">START GAME</button><button class="btn" data-a="demo">DEMO MODE</button><button class="btn" data-a="home">CANCEL</button></div></div></main>`}
function start(names){const players=names.map(name=>({id:uid(),name,score:0,alive:true,boxId:null,powers:Object.fromEntries(POWERS.map(x=>[x,{count:x==="Shield"?1:0,used:false}]))}));const contents=shuffle([["+100 POINTS","points",100],["+250 POINTS","points",250],["SHIELD","power","Shield"],["STEAL","power","Steal"],["DOUBLE","power","Double"],["TRAP -100","points",-100],["RISK +500 / -250","risk",500],["CHAOS","chaos",0]]);players.forEach((p,i)=>p.boxId=i+1);state.game={id:uid(),started:Date.now(),stage:0,players,boxes:contents.map((hidden,i)=>({id:i+1,ownerId:players[i].id,hidden,revealed:false,locked:false})),currentPlayer:null,question:null,mission:null,chaos:null,black:null,questionHistory:[],missionHistory:[],chaosHistory:[],actions:[],stats:{questions:0,missions:0,chaos:0,boxes:0,powers:0}};state.memory=[...new Set([...names,...state.memory])].slice(0,50);state.screen="game";save();sound("reveal");render()}
function act(fn){state.game.actions.push(clone(state.game));fn();save();render();sound("click")}
function undo(){if(!state.game?.actions.length)return toast("Nothing to undo.");state.game=state.game.actions.pop();save();render();toast("Last action undone.")}
function help(){return["Reveal the eight boxes. Hidden content stays with the box.","Choose an active player and let them select a box.","Run host-judged questions. Correct normally awards 100 points.","Everyone else covers their eyes while a private mission is shown.","Run the high-risk Danger decision.","Trigger a random Chaos event.","Open the Black Box for a major twist.","Final Three: Keep or Risk Everything.","Final Two: Keep or Switch.","Reveal the final standings. Ties should use a host estimation tie-breaker."][state.game.stage]}
function board(){return `<div class="scoreboard">${ranked().map((p,i)=>`<div class="player ${p.alive?"":"out"} ${state.game.currentPlayer===p.id?"active":""}"><div class="rank">#${i+1} · ${p.alive?"ACTIVE":"ELIMINATED"}</div><div class="name">${esc(p.name)}</div><div class="points">${p.score.toLocaleString("en-GB")}</div><div>${POWERS.filter(x=>p.powers[x].count>0).map(x=>`<span class="power">${x} ×${p.powers[x].count}</span>`).join("")}</div></div>`).join("")}</div>`}
function render(){if(!state.game||state.screen==="home")return home();if(state.screen==="setup")return setup();if(state.screen==="live")return live();game()}
function game(){const s=state.game.stage;$("#app").innerHTML=header()+`<main class="screen"><div class="space"><div><span class="stage">STAGE ${s+1} / 10 · ${STAGES[s]}</span><h1>${STAGES[s]}</h1></div><div class="row"><button class="btn" data-a="undo" ${state.game.actions.length?"":"disabled"}>UNDO</button><button class="btn" data-a="live">LIVE DISPLAY</button></div></div><div class="progress"><i style="width:${Math.round(s/9*100)}%"></i></div>${state.settings.help?`<div class="notice"><b>HOST HELP</b><br>${help()}</div>`:""}<div class="panel"><h2>SCOREBOARD</h2>${board()}</div><div class="panel" style="margin-top:14px">${stagePanel()}</div></main>`}
function stagePanel(){switch(state.game.stage){case 0:return boxes();case 1:return choice();case 2:return challenge();case 3:return missions();case 4:return dangerPanel();case 5:return chaosPanel();case 6:return blackPanel();case 7:return final3();case 8:return final2();default:return finalPanel()}}
function boxes(){return `<h2>MYSTERY BOXES</h2><p class="muted">Ownership and hidden content are separate.</p><div class="boxes">${state.game.boxes.map(b=>`<button class="box ${b.revealed?"revealed":""}" data-box="${b.id}" ${b.revealed||b.locked?"disabled":""}><small>BOX ${b.id} · ${esc(player(b.ownerId)?.name)}</small><strong>${b.revealed?esc(b.hidden[0]):"?"}</strong></button>`).join("")}</div><div class="row" style="margin-top:14px"><button class="btn primary" data-a="next">MOVE TO FIRST CHOICE</button></div>`}
function choice(){return `<h2>THE FIRST CHOICE</h2><p class="muted">Select an active player, then select an unrevealed box.</p><div class="row">${active().map(p=>`<button class="btn ${state.game.currentPlayer===p.id?"primary":""}" data-pick="${p.id}">${esc(p.name)}</button>`).join("")}</div><div class="boxes" style="margin-top:14px">${state.game.boxes.map(b=>`<button class="box" data-box="${b.id}" ${b.revealed||b.locked||!state.game.currentPlayer?"disabled":""}>BOX ${b.id}</button>`).join("")}</div><div class="row" style="margin-top:14px"><button class="btn" data-a="next">CHALLENGE ROOM</button></div>`}
function challenge(){const q=state.game.question;return `<h2>CHALLENGE ROOM</h2><p class="muted">Host reads the question and judges the answer.</p><div class="row">${active().map(p=>`<button class="btn" data-q="${p.id}">${esc(p.name)}</button>`).join("")}</div>${q?`<div class="reveal"><span class="stage">${esc(q.cat)} · ${esc(q.difficulty)}</span><h2>${esc(q.q)}</h2><div class="row" style="justify-content:center"><button class="btn" data-a="answer">SHOW ANSWER</button><button class="btn good" data-a="correct">CORRECT +100</button><button class="btn danger" data-a="wrong">WRONG</button><button class="btn" data-a="skip">SKIP</button></div><p class="${q.show?"":"hidden"}">ANSWER: <b>${esc(q.a)}</b></p></div>`:"<div class='reveal'><div class='big'>READY?</div><p>Select a player.</p></div>"}<div class="row"><button class="btn primary" data-a="next">SECRET MISSIONS</button></div>`}
function missions(){const m=state.game.mission;return `<h2>SECRET MISSIONS</h2><p class="muted">Everyone else covers their eyes. The selected player reads the mission privately.</p><div class="row">${active().map(p=>`<button class="btn" data-mission="${p.id}">${esc(p.name)}</button>`).join("")}</div>${m?`<div class="reveal"><div class="big">MISSION READY</div><p>Player: <b>${esc(player(m.playerId)?.name)}</b></p><button class="btn gold" data-a="private">SHOW PRIVATE MISSION</button></div>`:""}<div class="row"><button class="btn primary" data-a="next">DANGER ROUND</button></div>`}
function dangerPanel(){return `<h2 class="bad">DANGER ROUND</h2><p class="muted">Choose a player. Then run +500 or -250. Shield may protect a loss.</p><div class="row">${active().map(p=>`<button class="btn ${state.game.currentPlayer===p.id?"primary":""}" data-danger="${p.id}">${esc(p.name)}</button>`).join("")}</div><div class="reveal"><div class="big">RISK IT</div></div><div class="row"><button class="btn danger" data-a="danger">RUN DANGER</button><button class="btn" data-a="next">CHAOS</button></div>`}
function chaosPanel(){return `<h2>CHAOS</h2><div class="reveal"><div class="big">${esc(state.game.chaos||"CHAOS AWAITS")}</div></div><div class="row"><button class="btn primary" data-a="chaos">TRIGGER CHAOS</button><button class="btn" data-a="next">BLACK BOX</button></div>`}
function blackPanel(){return `<h2>THE BLACK BOX</h2><div class="reveal"><div class="big">${esc(state.game.black||"???")}</div></div><div class="row"><button class="btn gold" data-a="black">OPEN BLACK BOX</button><button class="btn" data-a="next">FINAL THREE</button></div>`}
function final3(){return `<h2>THE FINAL THREE</h2><p>Each finalist faces Keep or Risk Everything.</p><div class="row">${active().slice(0,3).map(p=>`<button class="btn gold" data-risk="${p.id}">${esc(p.name)} — RISK EVERYTHING</button>`).join("")}</div><div class="row"><button class="btn primary" data-a="next">LAST CHOICE</button></div>`}
function final2(){return `<h2>THE LAST CHOICE</h2><p>The final two choose Keep or Switch.</p><div class="row">${active().slice(0,2).map(p=>`<button class="btn" data-keep="${p.id}">${esc(p.name)} — KEEP</button><button class="btn gold" data-switch="${p.id}">${esc(p.name)} — SWITCH</button>`).join("")}</div><div class="row"><button class="btn primary" data-a="next">FINAL REVEAL</button></div>`}
function finalPanel(){const r=ranked(),w=r[0];return `<div class="center"><span class="stage">FINAL REVEAL</span><h2 class="big">WE HAVE A WINNER</h2><div class="reveal"><div class="eyebrow">AFTER DARK CHAMPION</div><div class="big" style="color:var(--gold);margin:12px 0">${esc(w?.name||"—")}</div><b>FINAL SCORE: ${(w?.score||0).toLocaleString("en-GB")}</b></div><div class="list">${r.map((p,i)=>`<div class="list-item"><b>${i+1}. ${esc(p.name)}</b> — ${p.score.toLocaleString("en-GB")} points</div>`).join("")}</div><p class="muted small">Questions: ${state.game.stats.questions} · Missions: ${state.game.stats.missions} · Chaos: ${state.game.stats.chaos} · Boxes: ${state.game.stats.boxes}</p><div class="row" style="justify-content:center"><button class="btn gold" data-a="finish">SAVE TO HISTORY</button><button class="btn primary" data-a="replay">PLAY AGAIN</button><button class="btn" data-a="new">NEW GAME</button></div></div>`}
function revealBox(id){const b=state.game.boxes.find(x=>x.id===id);if(!b||b.revealed||b.locked)return;const owner=player(b.ownerId)||player(state.game.currentPlayer);act(()=>{b.revealed=true;state.game.stats.boxes++;if(b.hidden[1]==="points")owner.score+=b.hidden[2];if(b.hidden[1]==="power")owner.powers[b.hidden[2]].count++;if(b.hidden[1]==="chaos")state.game.chaos=pick(CHAOS)});modal(`<h2>THE BOX HAS SPOKEN</h2><div class="reveal"><div class="big">${esc(b.hidden[0])}</div><p>Owner: <b>${esc(owner.name)}</b></p></div><button class="btn primary" data-a="close">CONTINUE</button>`);sound("reveal");fx("good")}
function nextQuestion(){let used=new Set(state.game.questionHistory),pool=QUESTIONS.map((q,i)=>({q,i})).filter(x=>!used.has(x.i));if(!pool.length){state.game.questionHistory=[];pool=QUESTIONS.map((q,i)=>({q,i}))}const x=pick(pool);state.game.questionHistory.push(x.i);return {...x.q}}
function chooseQuestion(id){act(()=>{const q=nextQuestion();q.playerId=id;q.show=false;state.game.question=q;state.game.stats.questions++})}
function assignMission(id){act(()=>{let pool=MISSIONS.filter((_,i)=>!state.game.missionHistory.includes(i));if(!pool.length){state.game.missionHistory=[];pool=MISSIONS}const text=pick(pool);state.game.missionHistory.push(MISSIONS.indexOf(text));state.game.mission={playerId:id,text};state.game.stats.missions++})}
function runDanger(){const p=player(state.game.currentPlayer);if(!p)return toast("Select a player first.");act(()=>{const shield=p.powers.Shield.count>0;if(Math.random()<.5)p.score+=500;else if(shield){p.powers.Shield.count--;p.powers.Shield.used=true}else p.score=Math.max(0,p.score-250)});sound("chaos");fx("bad")}
function runChaos(){act(()=>{let pool=CHAOS.filter((_,i)=>!state.game.chaosHistory.includes(i));if(!pool.length){state.game.chaosHistory=[];pool=CHAOS}const e=pick(pool);state.game.chaosHistory.push(CHAOS.indexOf(e));state.game.chaos=e;state.game.stats.chaos++;applyChaos(e)});sound("chaos");fx("bad")}
function applyChaos(e){const ps=active(),r=ranked(),hi=r[0],lo=r[r.length-1],a=pick(ps),others=ps.filter(x=>x.id!==a.id),b=pick(others.length?others:ps);if(e==="Everyone gains 100 points.")ps.forEach(x=>x.score+=100);else if(e==="Highest scorer loses 200 points.")hi.score=Math.max(0,hi.score-200);else if(e==="Lowest scorer gains 300 points.")lo.score+=300;else if(e==="Two random active players swap scores.")[a.score,b.score]=[b.score,a.score];else if(e==="A random active player gains 500 points.")a.score+=500;else if(e==="A random active player loses 100 points.")a.score=Math.max(0,a.score-100);else if(e==="A random active player receives a Shield.")a.powers.Shield.count++;else if(e.includes("250-point comeback"))lo.score+=250;else if(e==="All active players receive 50 points.")ps.forEach(x=>x.score+=50);else if(e.includes("last place receives 250"))lo.score+=250;else if(e.includes("Everyone except the leader gains 75"))ps.filter(x=>x.id!==hi.id).forEach(x=>x.score+=75);else toast("Host action required: follow the audience instruction.")}
function openBlack(){act(()=>{const r=ranked(),hi=r[0],lo=r[r.length-1],x=pick(["+1000 POINTS","+750 POINTS","LOWEST +600","HIGHEST -400","SHIELD FOR FINAL","COMEBACK +500"]);state.game.black=x;if(x==="+1000 POINTS")hi.score+=1000;if(x==="+750 POINTS")hi.score+=750;if(x==="LOWEST +600")lo.score+=600;if(x==="HIGHEST -400")hi.score=Math.max(0,hi.score-400);if(x==="SHIELD FOR FINAL")hi.powers.Shield.count++;if(x==="COMEBACK +500")lo.score+=500});sound("reveal");fx("good")}
function finalRisk(id){const p=player(id);if(!p)return;act(()=>Math.random()<.55?p.score+=700:p.score=Math.max(0,p.score-500));sound("reveal")}
function finalSwitch(id){const p=player(id);if(!p)return;act(()=>Math.random()<.5?p.score+=250:p.score=Math.max(0,p.score-250))}
function finalKeep(id){toast((player(id)?.name||"Player")+" keeps their current score.")}
function modal(content){$("#modal")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="modal-wrap" id="modal"><div class="modal">${content}</div></div>`)}
function privateMission(){const m=state.game.mission;if(!m)return;modal(`<h2>EVERYONE ELSE — COVER YOUR EYES</h2><div class="private"><div class="eyebrow">PRIVATE MISSION FOR ${esc(player(m.playerId)?.name)}</div><div class="mission">${esc(m.text)}</div><button class="btn gold" data-a="read">I HAVE READ IT</button></div>`)}
function live(){stopTimer();$("#app").innerHTML=`<main class="screen"><div class="space"><div><div class="eyebrow">LIVE DISPLAY</div><h1>DON'T PRESS IT <span style="color:var(--purple2)">AFTER DARK</span></h1></div><button class="btn" data-a="game">EXIT LIVE DISPLAY</button></div><div class="panel center"><span class="stage">${STAGES[state.game.stage]}</span><div class="big" style="margin:17px 0">${esc(state.game.chaos||state.game.black||"THE GAME IS LIVE")}</div></div><div style="margin-top:14px">${board()}</div><div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" data-a="fullscreen">FULL SCREEN</button></div></main>`}
function historyView(){$("#app").innerHTML=header()+`<main class="screen"><div class="space"><h1>GAME HISTORY</h1><button class="btn" data-a="home">BACK</button></div><div class="list">${state.history.length?state.history.map(h=>`<div class="list-item"><b>${esc(h.winner)}</b> — ${h.score.toLocaleString("en-GB")} points<br><span class="muted small">${new Date(h.date).toLocaleString("en-GB")}</span></div>`).join(""):"<div class='panel'>No completed games yet.</div>"}</div></main>`}
function memoryView(){$("#app").innerHTML=header()+`<main class="screen"><div class="space"><h1>PLAYER MEMORY</h1><button class="btn" data-a="home">BACK</button></div><div class="panel"><p class="muted">Names are stored only on this device.</p><div class="list">${state.memory.map((n,i)=>`<div class="list-item"><b>${esc(n)}</b> <button class="btn" data-remove="${i}">REMOVE</button></div>`).join("")||"<p>No saved players.</p>"}</div><button class="btn danger" data-a="clearmemory">CLEAR MEMORY</button></div></main>`}
function settingsView(){$("#app").innerHTML=header()+`<main class="screen"><div class="space"><h1>SETTINGS</h1><button class="btn" data-a="home">BACK</button></div><div class="panel grid"><label class="space">Sound <input type="checkbox" data-setting="sound" ${state.settings.sound?"checked":""}></label><label class="space">Host Help <input type="checkbox" data-setting="help" ${state.settings.help?"checked":""}></label><label class="space">Reduced Motion <input type="checkbox" data-setting="reduced" ${state.settings.reduced?"checked":""}></label><div class="field"><label>DEFAULT TIMER</label><select data-setting="timer">${[5,10,20,30,60].map(x=>`<option ${state.settings.timer===x?"selected":""}>${x}</option>`).join("")}</select></div></div></main>`}
function howView(){$("#app").innerHTML=header()+`<main class="screen"><div class="space"><h1>HOW TO PLAY</h1><button class="btn" data-a="home">BACK</button></div><div class="panel"><div class="list">${["8 players enter the game.","Mystery box ownership and hidden content are separate.","Questions are host-judged.","Secret missions use the cover-your-eyes private reveal.","Danger and Chaos create comeback opportunities.","The Black Box is a late-game twist.","Final Three: Keep or Risk Everything.","Final Two: Keep or Switch.","Highest final score wins; ties should use an estimation tie-breaker.","The game saves locally on the same device."].map(x=>`<div class="list-item">${x}</div>`).join("")}</div></div></main>`}
function planningView(){$("#app").innerHTML=header()+`<main class="screen"><div class="space"><h1>PRIZE / ENTRY PLANNING</h1><button class="btn" data-a="home">BACK</button></div><div class="panel"><p class="muted">Planning only. No payment processing, TikTok Coins/Gifts or automatic payouts.</p><div class="grid two"><div class="field"><label>ENTRY VALUE</label><input id="entry" type="number" min="0" value="0"></div><div class="field"><label>PLANNED PRIZE POOL</label><input id="pool" type="number" min="0" value="0"></div></div><button class="btn primary" data-a="calc">CALCULATE</button><div class="reveal" id="calc"><div class="big">PLANNING ONLY</div></div><p class="small muted">Confirm platform rules and applicable legal requirements before using paid entry or prizes.</p></div></main>`}
function finish(){const r=ranked(),w=r[0];state.history.unshift({date:Date.now(),winner:w?.name||"—",score:w?.score||0});state.history=state.history.slice(0,30);state.game=null;save();home();toast("Game saved to history.")}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; const a=b.dataset.a;
  if(a==="new"){setup()}
  else if(a==="home"){home()}
  else if(a==="replay"){const n=state.game?.players?.map(p=>p.name)||state.memory.slice(0,8);n.length===8?start(n):setup()}
  else if(a==="start"){const n=Array.from({length:8},(_,i)=>$("#n"+i)?.value.trim()||"");if(n.some(x=>!x))return toast("Enter all eight player names.");start(n)}
  else if(a==="demo"){start(["Alex","Jordan","Taylor","Sam","Charlie","Morgan","Jamie","Riley"])}
  else if(a==="next"){if(state.game.stage<9){state.game.stage++;state.game.currentPlayer=null;state.game.question=null;state.game.mission=null;save();render()}}
  else if(a==="undo"){undo()}
  else if(a==="live"){live()}
  else if(a==="game"){render()}
  else if(a==="how"){howView()}
  else if(a==="memory"){memoryView()}
  else if(a==="history"){historyView()}
  else if(a==="settings"){settingsView()}
  else if(a==="planning"){planningView()}
  else if(a==="close"){$("#modal")?.remove()}
  else if(a==="private"){privateMission()}
  else if(a==="read"){$("#modal")?.remove();toast("Mission read — keep it secret.")}
  else if(a==="answer"){state.game.question.show=true;save();render()}
  else if(a==="correct"){const q=state.game.question,p=player(q?.playerId);if(p)act(()=>{p.score+=100;state.game.question=null})}
  else if(a==="wrong"||a==="skip"){state.game.question=null;save();render()}
  else if(a==="danger"){runDanger()}
  else if(a==="chaos"){runChaos()}
  else if(a==="black"){openBlack()}
  else if(a==="finish"){finish()}
  else if(a==="fullscreen"){document.documentElement.requestFullscreen?.().catch(()=>{})}
  else if(a==="clearmemory"){state.memory=[];save();memoryView()}
  else if(a==="calc"){const v=Math.max(0,Number($("#pool")?.value)||0);$("#calc").innerHTML=`<div class="big">£${v.toFixed(2)}</div><p>Planned prize pool only.</p>`}
});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!state.game)return;
if(b.dataset.box)revealBox(Number(b.dataset.box));
if(b.dataset.pick){state.game.currentPlayer=b.dataset.pick;save();render()}
if(b.dataset.q)chooseQuestion(b.dataset.q);
if(b.dataset.mission)assignMission(b.dataset.mission);
if(b.dataset.danger){state.game.currentPlayer=b.dataset.danger;save();render()}
if(b.dataset.risk)finalRisk(b.dataset.risk);
if(b.dataset.switch)finalSwitch(b.dataset.switch);
if(b.dataset.keep)finalKeep(b.dataset.keep);
if(b.dataset.remove){state.memory.splice(Number(b.dataset.remove),1);save();memoryView()}
});
document.addEventListener("change",e=>{if(e.target.matches("[data-setting]")){const k=e.target.dataset.setting;state.settings[k]=e.target.type==="checkbox"?e.target.checked:Number(e.target.value);save()}});
render();
</script>
</body>
</html>
